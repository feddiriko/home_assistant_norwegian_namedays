<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Norwegian Namedays logo">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- Calendar outer ring -->
  <rect x="72" y="80" width="368" height="352" rx="56" fill="#0B1220" stroke="url(#ring)" stroke-width="14"/>

  <!-- Month header -->
  <rect x="102" y="118" width="308" height="54" rx="20" fill="url(#accent)"/>
  <text x="256" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">NAMES</text>

  <!-- Calendar squares -->
  <g fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="118" y="210" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="182" y="210" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="246" y="210" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="310" y="210" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="374" y="210" width="52" height="52" rx="12" fill="#1F2937"/>

    <rect x="118" y="274" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="182" y="274" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="246" y="274" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="310" y="274" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="374" y="274" width="52" height="52" rx="12" fill="#1F2937"/>

    <rect x="118" y="338" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="182" y="338" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="246" y="338" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="310" y="338" width="52" height="52" rx="12" fill="#1F2937"/>
    <rect x="374" y="338" width="52" height="52" rx="12" fill="#1F2937"/>
  </g>

  <!-- Highlighted active date -->
  <rect x="246" y="274" width="52" height="52" rx="12" fill="url(#accent)"/>
  <text x="272" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">N</text>

  <!-- Small Norwegian flag accent -->
  <rect x="110" y="390" width="70" height="18" rx="9" fill="#D6A84F"/>
  <rect x="110" y="390" width="16" height="18" rx="9" fill="#1D4ED8"/>
  <rect x="164" y="390" width="16" height="18" rx="9" fill="#1D4ED8"/>
</svg>
